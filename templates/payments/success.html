{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-6">
  <div class="card bg-base-200 shadow-sm border border-primary">
    <div class="card-body items-center text-center text-primary">

      <div class="bg-primary text-primary-content w-16 h-16 rounded-full flex items-center justify-center text-2xl mb-2">
        <i class="fa-solid fa-check"></i>
      </div>

      <h1 class="card-title text-2xl md:text-3xl font-bold text-primary">Thank you for your payment</h1>
      <p>Your Premium membership is being set up. It can take a moment to appear on your account.</p>

      <p class="text-sm mt-2 ">
        Questions about your order? Visit our
        <a href="{% url 'contact' %}" class="link link-primary">Help and Support</a> page.
      </p>

      <div class="card-actions w-full flex-col gap-2 mt-4">
        
        <a href="{% url 'profile' %}" class="btn btn-ghost btn-sm w-full text-primary">Back to profile</a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
