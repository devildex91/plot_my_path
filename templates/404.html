{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="flex items-center justify-center px-4 py-12">
  <div class="card bg-base-200 w-full max-w-md shadow-sm border border-primary text-primary">
    <div class="card-body items-center text-center">
      <img src="{% static 'images/pmp-logo.png' %}" alt="Plot My Path logo" class="h-20 w-auto mb-2" />

      <h1 class="text-6xl font-bold">404</h1>
      <h2 class="text-2xl font-semibold mt-2">Looks like you've taken a wrong turn!</h2>
      <p class="text-sm mt-1">We couldn't find the page you were looking for.</p>

      <div class="card-actions mt-6">
        <a href="{% url 'home' %}" class="btn btn-primary rounded-xl">Back to Home</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
