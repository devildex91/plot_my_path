{% load django_vite %}
{% load static %}

<!DOCTYPE html>
<html lang="en" data-theme="fantasy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plot My Path|Landing page</title>
    <link rel="stylesheet" href="{% vite_asset_url 'assets/styles/style.css' %}" />
    <meta name = "description" content="Plot My Path travel itinerary builder"/>
  </head>
  <body class="landing-page relative min-h-screen flex flex-col bg-cover bg-center bg-no-repeat">
    <div class="absolute inset-0 bg-base-100/50"></div>
    <header class="relative w-full flex justify-center pt-8">
      <img src="{% static 'images/pmp-logo.avif' %}" alt="Logo" class="w-50 h-auto"/>
    </header>

    <main class="relative flex flex-col items-center flex-grow mt-4 text-primary">
      <h1 class="text-4xl sm:text-5xl font-bold tracking-tight  w-fit mx-auto">Plot My Path</h1>
      <p class="mt-2 justify-self-center rounded-xl w-fit mx-auto">Plan · Explore · Make it Happen</p>
      <a href="{% url 'onboarding_page' %}" class="btn btn-primary rounded-xl w-fit mt-10 mx-auto sm:w-96">Your next adventure start here...</a>
    </main>

  

  </body>
</html>
